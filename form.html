<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM | WDD 131 | Long Kim Chau</title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals - Coded by a handsome guy named Long Kim Chau">
    <meta name="author" content="Long Kim Chau">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <!-------------------------------------------------------------------------------------------------------------------------------->
    <!----------------------------------------------------HEADER SECTION-------------------------------------------------------------->
    <!-------------------------------------------------------------------------------------------------------------------------------->
    <header>
        <h1>Product Review</h1>
    </header>


    <!-------------------------------------------------------------------------------------------------------------------------------->
    <!----------------------------------------------------MAIN SECTION---------------------------------------------------------------->
    <!-------------------------------------------------------------------------------------------------------------------------------->
    
    <main>
        <form action="review.html" method="get">

            <!-- 1. Product Name -->
            <div class="form-item">
                <label for="product-name">Product Name *</label>
                <select id="product-name" name="product" required>
                    <option value="" disabled selected>
                        Select a Product...
                    </option>
                </select>
            </div>

            
            <!-- 2. Overall Rating -->
            <fieldset class="rating-group">
                <legend>Overall Rating *</legend>

                <div class="rating-options">
                    <label for="rating-1">
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                        ☆
                    </label>

                    <label for="rating-2">
                        <input type="radio" id="rating-2" name="rating" value="2" required>
                        ☆☆
                    </label>

                    <label for="rating-3">
                        <input type="radio" id="rating-3" name="rating" value="3" required>
                        ☆☆☆
                    </label>

                    <label for="rating-4">
                        <input type="radio" id="rating-4" name="rating" value="4" required>
                        ☆☆☆☆
                    </label>

                    <label for="rating-5">
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                        ☆☆☆☆☆
                    </label>
                </div>
            </fieldset>

            <!-- 3. Date of Installation -->
            <div class="form-item">
                <label for="installation-date">Date of Installation</label>
                <input
                    type="date"
                    id="installation-date"
                    name="installation-date"
                    required
                >
            </div>

            <!-- 4. Useful Features -->
            <fieldset class="features-group">
                <legend>Which features did you find useful in the product?</legend>

                <p><em>(Check all that apply)</em></p>

                <div class="features-options">

                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        Durability
                    </label>

                    <label for="ease-of-use">
                        <input type="checkbox" id="ease-of-use" name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="Design">
                        Design
                    </label>

                </div>
            </fieldset>
    
            <!-- 5. Written Review -->
            <div class="form-item">
                <label for="written-review">
                    Written Review <span>(Optional)</span>
                </label>

                <textarea
                    id="written-review"
                    name="written-review"
                    rows="5"
                ></textarea>
            </div>

            <!-- 6. Your Name -->
            <div class="form-item">
                <label for="reviewer-name">
                    Your Name <span>(Optional)</span>
                </label>

                <input
                    type="text"
                    id="reviewer-name"
                    name="reviewer-name"
                    autocomplete="name"
                >
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Post Review">

        </form>
    </main>




    <!-------------------------------------------------------------------------------------------------------------------------------->
    <!----------------------------------------------------FOOTER SECTION-------------------------------------------------------------->
    <!-------------------------------------------------------------------------------------------------------------------------------->
    <footer>
        <p>
            <span>©</span><span id="currentyear"></span>
            <span> 🌸 </span>
            <span>Long Kim Chau</span>
            <span> 🌸 </span>
            <span>Vietnam</span>
        </p>
        <p><span id="lastModifiedLabel">Last Modification:</span> <span id="lastModified"></span></p>
    </footer>
</body>

</html>
